name: Build PHP 5.6 x64 NTS IIS (CVE patched)
run-name: PHP56-CVE-x64-NTS-IIS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      PHP56_ROOT: C:\p56
      PHP56_LOGS: C:\p56-logs
      PATCH_COMMIT: 01c04b75b6bcb8eb1730e639be50ff707ef0fc01

    steps:
      - name: Checkout pinned PHP 5.6 backports and build script
        uses: actions/checkout@v6
        with:
          repository: meuhland/php-legacy-windows-builds
          ref: 01c04b75b6bcb8eb1730e639be50ff707ef0fc01
          persist-credentials: false

      - name: Prepare paths and verify pinned patch series
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:PHP56_ROOT, $env:PHP56_LOGS)) {
            if (Test-Path -LiteralPath $path) { throw "Build path already exists: $path" }
            New-Item -ItemType Directory -Path $path | Out-Null
          }
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -or $commit -ne $env:PATCH_COMMIT) { throw 'Unexpected patch repository commit' }
          $patches = @(Get-ChildItem patches/5.6/*.patch | Sort-Object Name)
          if ($patches.Count -ne 3) { throw 'Expected exactly three PHP 5.6 patches' }
          $patches | Get-FileHash -Algorithm SHA256 |
            Select-Object Path, Hash | ConvertTo-Json |
            Set-Content "$env:PHP56_LOGS\patch-hashes.json"
          Copy-Item patches/5.6 "$env:PHP56_LOGS\patches" -Recurse
          Copy-Item build.ps1 "$env:PHP56_LOGS\upstream-build.ps1"

      - name: Install Microsoft VC11 and Update 5 from official offline media
        timeout-minutes: 65
        run: |
          $ErrorActionPreference = 'Stop'
          $media = 'C:\p56-media'
          New-Item -ItemType Directory -Path $media | Out-Null
          $packages = @(
            @{ Name = 'VS2012_WDX_ENU.iso'; Url = 'https://download.microsoft.com/download/1/F/5/1F519CC5-0B90-4EA3-8159-33BFB97EF4D9/VS2012_WDX_ENU.iso'; Setup = 'wdexpress_full.exe'; Version = '^11\.' },
            @{ Name = 'VS2012.5.iso'; Url = 'https://download.microsoft.com/download/1/7/A/17A8493D-BB25-4811-8242-CCCB74EF982E/VS2012.5.iso'; Setup = 'VS2012.5.exe'; Version = '^12\.|^11\.' }
          )
          foreach ($package in $packages) {
            $iso = Join-Path $media $package.Name
            & curl.exe --fail --location --retry 3 --output $iso $package.Url
            if ($LASTEXITCODE) { throw "Download failed: $($package.Name)" }
            Get-FileHash $iso -Algorithm SHA256 | Format-List | Out-String |
              Add-Content "$env:PHP56_LOGS\toolchain-media-hashes.txt"
            $disk = Mount-DiskImage -ImagePath $iso -PassThru
            try {
              $volume = $disk | Get-Volume
              if (-not $volume.DriveLetter) { throw 'Installer ISO has no drive letter' }
              $setup = "$($volume.DriveLetter):\$($package.Setup)"
              if (-not (Test-Path $setup)) { throw "Installer missing: $setup" }
              $signature = Get-AuthenticodeSignature $setup
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
                throw "Invalid Microsoft installer signature: $setup ($($signature.Status))"
              }
              $info = (Get-Item $setup).VersionInfo
              if ($info.ProductVersion -notmatch $package.Version) { throw "Unexpected installer version: $($info.ProductVersion)" }
              $info | Format-List ProductName, ProductVersion | Out-String |
                Add-Content "$env:PHP56_LOGS\toolchain-installers.txt"
              $log = "$env:PHP56_LOGS\$($package.Name).install.log"
              $process = Start-Process -FilePath $setup -ArgumentList @('/quiet', '/norestart', '/log', $log) -WindowStyle Hidden -PassThru -Wait
              if ($process.ExitCode -notin @(0, 3010)) { throw "Installer failed: $($package.Name), exit $($process.ExitCode). See installer log." }
              if ($process.ExitCode -eq 3010) { Write-Warning 'Installer requested restart; compiler preflight will check whether this runner can proceed.' }
            } finally {
              Dismount-DiskImage -ImagePath $iso
            }
          }
          $vs = "${env:ProgramFiles(x86)}\Microsoft Visual Studio 11.0"
          $vcvars = Join-Path $vs 'VC\vcvarsall.bat'
          $compiler = Join-Path $vs 'VC\bin\x86_amd64\cl.exe'
          if (-not (Test-Path $compiler)) { $compiler = Join-Path $vs 'VC\bin\amd64\cl.exe' }
          if (-not (Test-Path $vcvars) -or -not (Test-Path $compiler)) { throw 'VC11 x64 compiler was not installed' }
          $version = (Get-Item $compiler).VersionInfo.FileVersion
          if ($version -notmatch '^17\.00\.61030') { throw "Expected VS2012 Update 5 compiler 17.00.61030; found $version" }
          "VC11 compiler: $compiler ($version)" | Set-Content "$env:PHP56_LOGS\compiler.txt"
          "VS110COMNTOOLS=$vs\Common7\Tools\" >> $env:GITHUB_ENV

      - name: Build PHP 5.6.40 backport x64 NTS without SNMP or MSSQL
        timeout-minutes: 90
        run: |
          $ErrorActionPreference = 'Stop'
          # This pinned script checks out php-5.6.40 and applies patches/5.6 in name order.
          & .\build.ps1 -Version '5.6' -Root $env:PHP56_ROOT -Arch x64 -Flavors NTS `
            -VersionSuffix '-cve2026' `
            -ExtraConfigureArgs @('--without-snmp', '--without-mssql', '--without-pdo-mssql', '--disable-apache2-4handler')
          $src = "$env:PHP56_ROOT\phpdev\vc11\x64\php-5.6\src"
          $sourceCommit = (& git -C $src rev-parse HEAD).Trim()
          if ($LASTEXITCODE) { throw 'Cannot read PHP source commit' }
          & git -C $src diff --binary | Set-Content "$env:PHP56_LOGS\applied-source.diff"
          [ordered]@{
            source_repository = 'https://github.com/php/php-src'
            source_tag = 'php-5.6.40'
            source_commit = $sourceCommit
            patch_repository = 'https://github.com/meuhland/php-legacy-windows-builds'
            patch_commit = $env:PATCH_COMMIT
            architecture = 'x64'
            thread_safety = 'NTS'
            compiler = 'VC11 / Visual Studio 2012 Update 5'
            runtime_version = '5.6.40-cve2026'
            excluded = @('snmp', 'mssql', 'pdo_mssql', 'apache2-4handler')
            target = 'IIS FastCGI / php-cgi.exe'
            iis_server_test = 'Not performed; CLI, CGI startup and targeted PHPT checks only'
          } | ConvertTo-Json -Depth 5 | Set-Content "$env:PHP56_LOGS\build-manifest.json"

      - name: Verify x64 NTS ZIP and CLI and CGI startup
        run: |
          $ErrorActionPreference = 'Stop'
          $zips = @(Get-ChildItem "$env:PHP56_ROOT\dist\php-*.zip" |
            Where-Object Name -NotMatch '^php-(debug|devel|test)-pack-')
          if ($zips.Count -ne 1) { throw "Expected one binary ZIP, found $($zips.Count)" }
          $verify = "$env:PHP56_ROOT\verify"
